[tool.poetry]
name = "wavekit"
version = "0.9.8"
description = "wavekit-plus: Fork of wavekit with VCD_ANALYZER VCDParser replacing vcdvcd"
authors = ["cxzzzz <cxz19961010@outlook.com>", "neveltyc <neveltyc@gmail.com>"]
readme = "README.md"
repository = "https://github.com/neveltyc/wavekitplus"

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^2.0.0"
pylibfst = { version = "^0.2.1", optional = true }

[tool.poetry.extras]
fst = ["pylibfst"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.2"
mypy = "^1.11.2"
pytest = "^8.2.2"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["B017"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["misc"]

[build-system]
requires = ["poetry-core", "Cython", "setuptools", "wheel", "numpy>=2.0.0"]
build-backend = "poetry.core.masonry.api"
